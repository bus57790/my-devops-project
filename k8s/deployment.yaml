apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-web-app
  namespace: enterprise-app-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enterprise-web-app
  template:
    metadata:
      labels:
        app: enterprise-web-app
    spec:
      containers:
      - name: java-app
        image: docker.io/your-dockerhub-user/enterprise-web-app:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-web-app-svc
  namespace: enterprise-app-prod
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30090
  selector:
    app: enterprise-web-app
